[package]
name = "heartbridge"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
description = "Heart rate from a Bluetooth LE chest strap to VRChat, OBS and your own apps"

[dependencies]
anyhow = "1.0.104"
btleplug = "0.13.5"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
egui = { version = "0.37", default-features = false }
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tray-icon = { version = "0.26.1", default-features = false }
uuid = "1.29.3"

# Linux: X11 and Wayland windows; the StatusNotifierItem tray needs no GTK.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
# Builds libdbus (for Bluetooth via BlueZ) from source: no -dev package needed.
libdbus-sys = { version = "0.2", features = ["vendored"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
