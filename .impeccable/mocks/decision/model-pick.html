<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>HS500 Pulso · dorsal</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:440px;height:720px;overflow:hidden;background:#2A2A2A;font-family:"Bahnschrift","Segoe UI",sans-serif;color:#141414}
  .bib{margin:20px;background:#F4F3EF;height:360px;position:relative;display:grid;grid-template-rows:56px 1fr 44px}
  .stripe{background:#D7262E;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-weight:700;letter-spacing:.08em;font-size:15px}
  .num{display:flex;align-items:center;justify-content:center;font-size:190px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
  .sub{background:#1E4FA8;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:14px;font-weight:600}
  .pin{position:absolute;width:12px;height:12px;border-radius:50%;background:#2A2A2A;border:2px solid #CFCDC6}
  .p1{left:12px;top:68px}.p2{right:12px;top:68px}.p3{left:12px;bottom:56px}.p4{right:12px;bottom:56px}
  .set{margin:0 20px;color:#EDEDED;font-family:"Segoe UI",sans-serif;font-size:14px}
  .r{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #444}
  .sw{width:38px;height:22px;border-radius:11px;background:#D7262E}.off{background:#555}
  .f{margin-top:12px;padding:9px 12px;background:#F4F3EF;color:#141414}
</style></head><body>
<div class="bib">
  <div class="stripe"><span>HS500 PULSO</span><span>BAT 100%</span></div>
  <div class="num">128</div>
  <div class="sub"><span>bpm · contacto sí</span><span>VRChat :9000</span></div>
  <i class="pin p1"></i><i class="pin p2"></i><i class="pin p3"></i><i class="pin p4"></i>
</div>
<div class="set">
  <div class="r"><span>Parámetros del avatar</span><span class="sw"></span></div>
  <div class="r"><span>Chatbox</span><span class="sw off"></span></div>
  <div class="f">♥ {bpm} bpm</div>
  <div class="r"><span>Modo compacto</span><span>Siempre visible</span></div>
</div>
</body></html>
