<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>HS500 Pulso · señalética</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:440px;height:720px;overflow:hidden;background:#2B2B2B;font-family:"Segoe UI Variable Display","Segoe UI",sans-serif}
  .y{background:#FFC300;color:#111;padding:18px 22px;display:flex;align-items:center;gap:18px;height:250px}
  .y b{font-size:170px;font-weight:700;line-height:.9;font-variant-numeric:tabular-nums}
  .y div{font-size:22px;font-weight:600;line-height:1.3}
  .k{background:#111;color:#fff;display:flex;align-items:center;gap:14px;padding:14px 22px;border-top:2px solid #2B2B2B;font-size:20px}
  .k .ic{width:34px;height:34px;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-weight:700}
  .k .ar{margin-left:auto;font-size:26px;color:#FFC300}
  .set{padding:16px 22px;color:#EEE;font-size:15px}
  .r{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #444}
  .sw{width:38px;height:22px;border-radius:11px;background:#FFC300}.off{background:#555}
  .f{margin-top:12px;padding:9px 12px;border:1px solid #555}
</style></head><body>
<div class="y"><b>128</b><div>bpm<br>Moderada</div></div>
<div class="k"><span class="ic">B</span><span>Banda · conectada</span><span class="ar">→</span></div>
<div class="k"><span class="ic">V</span><span>VRChat · 127.0.0.1:9000</span><span class="ar">→</span></div>
<div class="k"><span class="ic">%</span><span>Batería 100%</span></div>
<div class="set">
  <div class="r"><span>Parámetros del avatar</span><span class="sw"></span></div>
  <div class="r"><span>Chatbox</span><span class="sw off"></span></div>
  <div class="f">♥ {bpm} bpm</div>
</div>
</body></html>
