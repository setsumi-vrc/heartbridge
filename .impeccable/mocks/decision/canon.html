<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>HS500 Pulso · estándar</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:440px;height:720px;overflow:hidden;background:#0E0F12;color:#fff;font-family:"Segoe UI",sans-serif}
  .c{margin:14px 16px;background:#1A1C21;border-radius:16px;padding:18px}
  .hero{display:flex;align-items:center;gap:16px;height:200px}
  .heart{width:64px;height:58px;background:#FF3B47;border-radius:50% 50% 8px 50%;transform:rotate(45deg)}
  .hero b{font-size:96px;font-weight:700;font-variant-numeric:tabular-nums}
  .hero span{color:#9AA0A8;font-size:18px}
  .r{display:flex;justify-content:space-between;padding:10px 0;font-size:15px}
  .m{color:#9AA0A8}
  .sw{width:40px;height:24px;border-radius:12px;background:#FF3B47}.off{background:#3A3D44}
  .f{margin-top:8px;padding:10px 12px;background:#0E0F12;border-radius:10px}
</style></head><body>
<div class="c hero"><div class="heart"></div><div><b>128</b> <span>bpm</span></div></div>
<div class="c"><div class="r"><span class="m">Banda</span><span>Conectada · 100%</span></div><div class="r"><span class="m">VRChat</span><span>127.0.0.1:9000</span></div></div>
<div class="c"><div class="r"><span>Parámetros del avatar</span><span class="sw"></span></div><div class="r"><span>Chatbox</span><span class="sw off"></span></div><div class="f">♥ {bpm} bpm</div></div>
</body></html>
